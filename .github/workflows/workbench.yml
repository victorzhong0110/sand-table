name: Workbench
on:
  push:
    paths: ['workbench/**', '.github/workflows/workbench.yml']
  pull_request:
    paths: ['workbench/**', '.github/workflows/workbench.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Clone external read-only fixture
        run: |
          git init /tmp/sand-clsx
          git -C /tmp/sand-clsx remote add origin https://github.com/lukeed/clsx.git
          git -C /tmp/sand-clsx fetch --depth 1 origin 925494cf31bcd97d3337aacd34e659e80cae7fe2
          git -C /tmp/sand-clsx checkout --detach FETCH_HEAD
      - run: npm test
        env:
          SAND_EXTERNAL_REPO: /tmp/sand-clsx
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          SAND_EXTERNAL_REPO: /tmp/sand-clsx
