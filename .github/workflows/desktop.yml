name: Windows desktop
on:
  pull_request:
    paths: ['desktop/**', 'workbench/local/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: npm ci --ignore-scripts
        working-directory: workbench
      - run: npm run build
        working-directory: workbench
      - run: npm ci
        working-directory: desktop
      - run: node --test desktop/tests/*.test.cjs
      - run: npm run dist
        working-directory: desktop
      # setup.exe 是带向导的安装器（oneClick: false）。CI 上没有人操作，
      # Start-Process -Wait 会一直占到 job 超时。这里不启动它，也不传 /S、/D=。
      # 能否打开由便携版冒烟检查；安装包仍由 dist 产出并在后面上传。
      - name: Open the actual portable executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem desktop/dist/*-portable.exe | Select-Object -First 1
          node desktop/scripts/portable-smoke.mjs --executable $exe.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-desktop-preview
          path: |
            desktop/dist/*-setup.exe
            desktop/dist/*-portable.exe
            desktop/dist/smoke/**/*.png
